name: Bump Sample Version
description: >
  Bumps the version of a sample app in its native version manifest, so samples
  built on different stacks can share one release flow. Supported manifests
  (checked in order): package.json (npm/pnpm/yarn), pubspec.yaml (Flutter/Dart),
  build.gradle.kts (Android) and *.xcodeproj/project.pbxproj (iOS).

inputs:
  path:
    description: Sample app directory, relative to the repo root (e.g. self-care/account)
    required: true
  bump_type:
    description: Version bump type (patch, minor or major)
    required: true

outputs:
  version:
    description: The new semantic version (e.g. 1.2.3), without any build metadata
    value: ${{ steps.bump.outputs.version }}
  manifest:
    description: Path of the updated manifest file (relative to the workspace root), for staging
    value: ${{ steps.bump.outputs.manifest }}

runs:
  using: composite
  steps:
    - name: Bump
      id: bump
      shell: bash
      run: |
        SAMPLE_PATH="${{ inputs.path }}"
        BUMP_TYPE="${{ inputs.bump_type }}"

        case "${BUMP_TYPE}" in
          patch|minor|major) ;;
          *)
            echo "Error: unsupported bump_type '${BUMP_TYPE}' (expected patch, minor or major)"
            exit 1
            ;;
        esac

        # Bumps a plain X.Y.Z version string according to BUMP_TYPE.
        bump_semver() {
          local MAJOR MINOR PATCH
          IFS=. read -r MAJOR MINOR PATCH <<< "$1"
          case "${BUMP_TYPE}" in
            major) echo "$((MAJOR + 1)).0.0" ;;
            minor) echo "${MAJOR}.$((MINOR + 1)).0" ;;
            patch) echo "${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
        }

        if [ -f "${SAMPLE_PATH}/package.json" ]; then
          MANIFEST="${SAMPLE_PATH}/package.json"
          (cd "${SAMPLE_PATH}" && npm version "${BUMP_TYPE}" --no-git-tag-version --ignore-scripts > /dev/null)
          VERSION=$(node -p "require('./${MANIFEST}').version")

        elif [ -f "${SAMPLE_PATH}/pubspec.yaml" ]; then
          MANIFEST="${SAMPLE_PATH}/pubspec.yaml"
          CURRENT=$(sed -n -E 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' "${MANIFEST}" | head -1)
          if [ -z "${CURRENT}" ]; then
            echo "Error: no 'version:' field found in ${MANIFEST}"
            exit 1
          fi

          VERSION=$(bump_semver "${CURRENT%%+*}")
          # Flutter maps the +N build number to Android versionCode / iOS CFBundleVersion,
          # which must increase monotonically, so always increment it alongside the version.
          if [[ "${CURRENT}" == *+* ]]; then
            BUILD=$(( ${CURRENT#*+} + 1 ))
          else
            BUILD=1
          fi
          sed -i -E "s/^version:[[:space:]]*[^[:space:]#]+/version: ${VERSION}+${BUILD}/" "${MANIFEST}"

        elif [ -f "${SAMPLE_PATH}/build.gradle.kts" ] && grep -q 'versionName = "' "${SAMPLE_PATH}/build.gradle.kts"; then
          MANIFEST="${SAMPLE_PATH}/build.gradle.kts"
          CURRENT=$(sed -n -E 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' "${MANIFEST}" | head -1)
          CODE=$(sed -n -E 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' "${MANIFEST}" | head -1)
          if [ -z "${CURRENT}" ] || [ -z "${CODE}" ]; then
            echo "Error: no 'versionName'/'versionCode' found in ${MANIFEST}"
            exit 1
          fi

          VERSION=$(bump_semver "${CURRENT}")
          # versionCode must increase monotonically for Android to accept the upgrade.
          sed -i -E "s/^([[:space:]]*versionName = )\"[^\"]+\"/\1\"${VERSION}\"/" "${MANIFEST}"
          sed -i -E "s/^([[:space:]]*versionCode = )[0-9]+/\1$((CODE + 1))/" "${MANIFEST}"

        elif PBXPROJ=$(ls "${SAMPLE_PATH}"/*.xcodeproj/project.pbxproj 2>/dev/null | head -1) && [ -n "${PBXPROJ}" ]; then
          MANIFEST="${PBXPROJ}"
          CURRENT=$(sed -n -E 's/^[[:space:]]*MARKETING_VERSION = ([^;]+);.*/\1/p' "${MANIFEST}" | head -1)
          BUILD=$(sed -n -E 's/^[[:space:]]*CURRENT_PROJECT_VERSION = ([0-9]+);.*/\1/p' "${MANIFEST}" | head -1)
          if [ -z "${CURRENT}" ] || [ -z "${BUILD}" ]; then
            echo "Error: no 'MARKETING_VERSION'/'CURRENT_PROJECT_VERSION' found in ${MANIFEST}"
            exit 1
          fi

          VERSION=$(bump_semver "${CURRENT}")
          # Every build configuration carries its own copy, so rewrite all of them. The build
          # number (CFBundleVersion) must increase monotonically, like the Flutter +N above.
          sed -i -E "s/^([[:space:]]*MARKETING_VERSION = )[^;]+;/\1${VERSION};/" "${MANIFEST}"
          sed -i -E "s/^([[:space:]]*CURRENT_PROJECT_VERSION = )[0-9]+;/\1$((BUILD + 1));/" "${MANIFEST}"

        else
          echo "Error: no supported version manifest (package.json, pubspec.yaml, build.gradle.kts, project.pbxproj) found in ${SAMPLE_PATH}"
          exit 1
        fi

        echo "Bumped ${SAMPLE_PATH} to ${VERSION} (${MANIFEST})"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "manifest=${MANIFEST}" >> "$GITHUB_OUTPUT"
