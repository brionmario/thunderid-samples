allowBuilds:
  core-js: false
  esbuild: true

auditConfig:
  ignoreGhsas:
    # JUSTIFICATION: GHSA-86w9-cpqp-85rv — node-forge accepts extra nested DigestAlgorithm elements
    # during RSA PKCS#1 v1.5 signature verification. No patched release exists (1.4.0 is the latest
    # and is affected). Transitive via nuxt's dev tooling (`@nuxt/cli` / `nitropack` > `listhen` >
    # `node-forge`), which only uses it to generate RSA keys and self-signed certificates for the
    # local HTTPS dev server; it never verifies signatures. Revisit once node-forge publishes a fix.
    - GHSA-86w9-cpqp-85rv
    # JUSTIFICATION: GHSA-vfj7-8cjw-p6xm — braces stack-exhaustion DoS through deeply nested brace
    # patterns. No patched release exists (3.0.3 is the latest and is affected). Transitive via
    # nuxt's build tooling (`@nuxt/nitro-server` > `nitropack` > `globby` > `fast-glob` >
    # `micromatch` > `braces`), which only expands glob patterns taken from the project's own config
    # and filesystem at build time. Revisit once braces publishes a fix.
    - GHSA-vfj7-8cjw-p6xm
